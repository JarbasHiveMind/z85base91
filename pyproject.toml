[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "z85base91"
description = "base91, z85b and z85p encodings"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["hivemind", "encoding", "z85", "base91"]
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/z85base91"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["z85base91"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "z85base91.version.__version__" }
